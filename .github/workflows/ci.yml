name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      # Postgres-сервис для проверки, что миграции и smoke-вызовы работают
      # на целевом диалекте. SQLite-прогон делаем отдельным шагом — пока
      # прод ещё на нём, регрессии нужно ловить на обоих.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: goszakup
          POSTGRES_USER: goszakup
          POSTGRES_PASSWORD: goszakup_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goszakup -d goszakup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # На проде стоит 3.12 (см. CLAUDE.md → «Продакшн»).
          # Тестируем на 3.12 — тот же интерпретатор, что в проде.
          python-version: "3.12"
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src/ scripts/ tests/ migrations/

      - name: Alembic upgrade against fresh SQLite
        env:
          GZ_DATABASE_URL: sqlite:///${{ runner.temp }}/ci_alembic.sqlite
        run: |
          alembic upgrade head
          alembic current

      - name: Alembic upgrade against Postgres
        env:
          GZ_DATABASE_URL: postgresql+psycopg://goszakup:goszakup_ci@localhost:5432/goszakup
        run: |
          alembic upgrade head
          alembic current
          # Sanity: seed presets и stats — это touch'ит большинство таблиц.
          python -m goszakup.cli seed-presets
          python -m goszakup.cli stats

      - name: Pytest
        run: pytest -q

[project]
name = "goszakup"
version = "0.1.0"
description = "Goszakup.kz lot tracker — daily scrape, SQLite store, web UI"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "passlib[bcrypt]>=1.7",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "cerebras-cloud-sdk>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
